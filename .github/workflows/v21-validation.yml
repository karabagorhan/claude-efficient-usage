name: V2.1-ENG validation

on:
  push:
    branches: [feature/v2.1-eng-currency]
  pull_request:
    branches: [claude/harcama-defteri]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harcama-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harcama-app/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Translation catalog audit
        run: npm run check:i18n
      - name: Financial and language regressions
        run: npm run test:core
      - name: FX/currency regressions
        run: npx -y tsx scripts/fx-test.ts
      - name: iOS JavaScript bundle smoke build
        run: npx expo export --platform ios
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
